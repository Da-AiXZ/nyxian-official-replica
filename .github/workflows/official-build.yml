name: Build iOS App

# ─────────────────────────────────────────────────────────────────────────────
# 审计实验：官方 emexlab/Nyxian build.yml 原样复刻（0.11.4）
#
# 与官方 build.yml（gh api 原文核对）的差异只有一处：
#   官方只上传 Nyxian.ipa → 本仓额外追加一个 artifact 上传步，
#   把 make all 产出的工具链（LLVM.xcframework / CoreCompilerSupportLibs /
#   SwiftToolchain.zip）与 ipa 一并上传。
# 构建步骤（checkout / VERSION / brew / CHECK_DEPS=0 make all / upload）逐字照抄官方，
# timeout-minutes: 1200 也是官方原文。
# 无缓存、无修补、无自研合并、无输出截断。
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: emexlab/Nyxian
          ref: 0.11.4
          submodules: recursive

      - name: Extract version
        run: |
          VERSION=$(awk -F'=' '/^[[:space:]]*VERSION[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); print $2; exit}' Config.xcconfig)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          set -e

          # Packages we desperately need
          brew install ldid dpkg libarchive

      - name: Setup
        run: |
          set -e

      - name: Build Nyxian
        timeout-minutes: 1200
        run: |
          set -e

          CHECK_DEPS=0 make all

      - name: Upload Nyxian
        uses: actions/upload-artifact@v7
        with:
          path: Nyxian.ipa
          archive: false

      # ── 唯一非官方步（追加）：官方只传 ipa；此处把 make all 产出的工具链一并上传 ──
      # if: always() → 即使 App 编译段失败，只要 make all 出了工具链也能传出来
      - name: Upload toolchain (LLVM.xcframework + CoreCompilerSupportLibs + SwiftToolchain.zip)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          path: |
            LLVM-On-iOS/LLVM.xcframework
            LLVM-On-iOS/CoreCompilerSupportLibs
            LLVM-On-iOS/SwiftToolchain.zip
          compression-level: 0
          if-no-files-found: error
