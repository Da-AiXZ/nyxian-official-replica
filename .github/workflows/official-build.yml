name: official-build

# ─────────────────────────────────────────────────────────────────────────────
# 审计实验：官方 emexlab/Nyxian 构建流程原样复刻
#
# 触发方式与官方一致 = push（官方 build.yml 即 push 触发，见官方日志
# "Job defined at: emexlab/Nyxian/.github/workflows/build.yml@refs/heads/main"）。
#
# 步骤逐字对应官方 build.yml（零自研步骤）：
#   ① checkout 官方仓 0.11.4 release commit 0c61cfb + recursive submodules（官方=checkout 自身仓+子模块）
#   ② VERSION 读取（awk Config.xcconfig，逐字）
#   ③ brew install ldid dpkg libarchive（逐字）
#   ④ CHECK_DEPS=0 make all（逐字）
#   ⑤ upload artifact Nyxian.ipa
#
# 无缓存、无修补、无自研合并、无输出截断；完整日志由 GitHub Actions 全量保留。
# 注意：push 到 main 即触发全量构建（约 5h）。
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # 用户拍板（2026-10-16）：0.11.4 = 官方正式 release（官方 CI 构建并发布过，必然可绿）。
  # 对照基准 = 官方 0.11.4 release 的 Nyxian.ipa = 111,250,101 bytes。
  # （0587c30 = 官方 10-01 最后一次绿跑 commit，另一实验线并行对照）
  NYXIAN_REF: 0c61cfb57ee3d85d96a7102132db4268bcaa1db3

jobs:
  Build-and-Package:
    runs-on: macos-latest
    steps:
      - name: Checkout Nyxian (official repo, recursive submodules)
        uses: actions/checkout@v4
        with:
          repository: emexlab/Nyxian
          ref: ${{ env.NYXIAN_REF }}
          submodules: recursive
          fetch-depth: 1

      - name: Read VERSION (official step, verbatim)
        run: |
          VERSION=$(awk -F'=' '/^[[:space:]]*VERSION[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); print $2; exit}' Config.xcconfig)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies (official step, verbatim)
        run: |
          set -e
          brew install ldid dpkg libarchive

      - name: Build (official step, verbatim CHECK_DEPS=0 make all)
        run: |
          set -e
          CHECK_DEPS=0 make all

      - name: Upload artifact (official step Nyxian.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: Nyxian.ipa
          if-no-files-found: error
          compression-level: 6
